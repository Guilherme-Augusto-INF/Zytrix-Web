 <head>
  <meta charset="utf-8"/>

  <title>
   Zytrix — Registrar
  </title>
  <link href="assets/css/styles.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/features.css">
  <meta name="description" content="Crie sua conta Zytrix para acompanhar criadores, participar de lives e fazer parte da comunidade.">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="googlebot" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <link rel="canonical" href="https://zytrix-lives.vercel.app/registro.html">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zytrix">
  <meta property="og:title" content="Zytrix — Registrar">
  <meta property="og:description" content="Crie sua conta Zytrix para acompanhar criadores, participar de lives e fazer parte da comunidade.">
  <meta property="og:url" content="https://zytrix-lives.vercel.app/registro.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Zytrix — Registrar">
  <meta name="twitter:description" content="Crie sua conta Zytrix para acompanhar criadores, participar de lives e fazer parte da comunidade.">
<link rel="stylesheet" href="/assets/css/policies.css">
</head>
 <body>
  <div data-header="">
  </div>
  <main class="auth-shell">
   <form class="card auth-card" data-auth-form="" data-mode="register">
    <div class="brand" style="justify-content:center">
     <span class="brand-mark">
      Z
     </span>
     <span>
      Zytrix
     </span>
    </div>
    <h1>
     Registrar
    </h1>
    <div class="form-group">
     <label for="register-username">
      Nome de usuário
     </label>
     <input class="input" maxlength="30" minlength="2" id="register-username" name="username" required=""/>
    </div>
    <div class="form-group">
     <label for="register-email">
      E-mail
     </label>
     <input class="input" id="register-email" name="email" required="" type="email"/>
    </div>
    <div class="form-group">
     <label for="register-password">
      Senha
     </label>
     <input class="input" minlength="6" id="register-password" name="password" required="" type="password"/>
    </div>
    <button class="btn btn-purple" style="width:100%">
     Criar conta
    </button>
    <button class="btn" id="google-login" style="width:100%;margin-top:12px" type="button">
     Entrar com Google
    </button>
    <p class="muted" style="text-align:center">
     Já possui conta?
     <a href="login.html" style="color:#fff">
      Entrar
     </a>
    </p>
    <div class="hidden" id="message">
    </div>
   </form>
  </main>
  <div data-footer=""><footer class="site-footer container"><nav class="governance-links" aria-label="Políticas e segurança"><a href="/termos">Termos</a><a href="/privacidade">Privacidade</a><a href="/diretrizes-da-comunidade">Diretrizes da Comunidade</a><a href="/denuncias-e-moderacao">Denúncias e Moderação</a><a href="/conteudo-proibido">Conteúdo Proibido</a><a href="/politicas">Central de políticas</a></nav></footer></div>
  <script src="assets/js/auth-pages.js" type="module">
  </script>
   <script type="module" src="assets/js/global-features.js"></script>
</body>
</html>
