<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Zytrix — Registrar
  </title>
  <link href="assets/css/styles.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/features.css">
 </head>
 <body>
  <div data-header="">
  </div>
  <main class="auth-shell">
   <form class="card auth-card" data-auth-form="" data-mode="register">
    <div class="brand" style="justify-content:center">
     <span class="brand-mark">
      Z
     </span>
     <span>
      Zytrix
     </span>
    </div>
    <h1>
     Registrar
    </h1>
    <div class="form-group">
     <label>
      Nome de usuário
     </label>
     <input class="input" maxlength="30" minlength="2" name="username" required=""/>
    </div>
    <div class="form-group">
     <label>
      E-mail
     </label>
     <input class="input" name="email" required="" type="email"/>
    </div>
    <div class="form-group">
     <label>
      Senha
     </label>
     <input class="input" minlength="6" name="password" required="" type="password"/>
    </div>
    <button class="btn btn-purple" style="width:100%">
     Criar conta
    </button>
    <button class="btn" id="google-login" style="width:100%;margin-top:12px" type="button">
     Entrar com Google
    </button>
    <p class="muted" style="text-align:center">
     Já possui conta?
     <a href="login.html" style="color:#fff">
      Entrar
     </a>
    </p>
    <div class="hidden" id="message">
    </div>
   </form>
  </main>
  <div data-footer="">
  </div>
  <script src="assets/js/auth-pages.js" type="module">
  </script>
   <script type="module" src="assets/js/global-features.js"></script>
</body>
</html>
