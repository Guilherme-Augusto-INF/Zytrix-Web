<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Zytrix — Recuperar senha
  </title>
  <link href="assets/css/styles.css" rel="stylesheet"/>
 </head>
 <body>
  <div data-header="">
  </div>
  <main class="auth-shell">
   <form class="card auth-card" data-auth-form="" data-mode="reset">
    <div class="brand" style="justify-content:center">
     <span class="brand-mark">
      Z
     </span>
     <span>
      Zytrix
     </span>
    </div>
    <h2 style="text-align:center">
     Recuperar senha
    </h2>
    <p class="muted">
     Digite o e-mail cadastrado para receber o link de redefinição.
    </p>
    <div class="form-group">
     <label>
      E-mail
     </label>
     <input class="input" name="email" required="" type="email"/>
    </div>
    <button class="btn btn-purple" style="width:100%">
     Enviar link
    </button>
    <p style="text-align:center">
     <a class="muted" href="login.html">
      Voltar para entrar
     </a>
    </p>
    <div class="hidden" id="message">
    </div>
   </form>
  </main>
  <div data-footer="">
  </div>
  <script src="assets/js/auth-pages.js" type="module">
  </script>
 </body>
</html>
