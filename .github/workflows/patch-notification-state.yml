name: Patch notification state rules

on:
  push:
    branches: [zycoin-support-notifications]
    paths:
      - ".github/workflows/patch-notification-state.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: zycoin-support-notifications

      - name: Add private notification state rules
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("firestore.rules"),
              Path("firebase/firestore.rules"),
              Path("REGRAS-PARA-COLAR-NO-FIREBASE.txt"),
          ]

          anchor = """      // ================================================
      // HISTÓRICO
      // ================================================
"""

          block = """      // ================================================
      // ESTADO DAS NOTIFICAÇÕES
      // ================================================
      //
      // Documento privado da própria conta usado apenas
      // para sincronizar lido/não lido entre dispositivos.
      // Não cria notificações e não altera Zy Coins.
      // ================================================

      match /notificationState/{stateId} {

        allow read:
          if isOwner(uid)
          || isAdmin();

        allow create, update:
          if isOwner(uid)

          && stateId == "zycoins"

          && request.resource.data.uid == uid

          && request.resource.data.lastSupportSeenAt
              == request.time

          && request.resource.data.updatedAt
              == request.time

          && request.resource.data.keys().hasAll([
            "uid",
            "lastSupportSeenAt",
            "updatedAt"
          ])

          && request.resource.data.keys().hasOnly([
            "uid",
            "lastSupportSeenAt",
            "updatedAt"
          ]);

        allow delete:
          if isOwner(uid)
          || isAdmin();
      }


"""

          changed = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "match /notificationState/{stateId}" in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f"Anchor not found in {path}")
              path.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8")
              changed.append(str(path))

          print("Patched:", ", ".join(changed) if changed else "already patched")
          PY

      - name: Commit synchronized rules
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No rule changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules firebase/firestore.rules REGRAS-PARA-COLAR-NO-FIREBASE.txt
          git commit -m "feat: secure synced notification read state"
          git push origin HEAD:zycoin-support-notifications
