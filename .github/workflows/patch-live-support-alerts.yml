name: Patch live support alerts

on:
  push:
    branches: [zycoin-support-notifications]
    paths:
      - "scripts/patch-live-support-alerts.py"
      - ".github/workflows/patch-live-support-alerts.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: zycoin-support-notifications

      - name: Apply integration patch
        run: python3 scripts/patch-live-support-alerts.py

      - name: Validate JavaScript and synchronized rules
        shell: bash
        run: |
          set -e
          node --check assets/js/live.js
          node --check assets/js/config-live.js
          node --check assets/js/live-support-alerts.js
          node --check assets/js/live-player-access.js
          node --check assets/js/support-alert-sound.js
          cmp -s firestore.rules firebase/firestore.rules
          cmp -s firestore.rules REGRAS-PARA-COLAR-NO-FIREBASE.txt

      - name: Commit generated integration
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/live.js assets/js/config-live.js assets/css/styles.css live.html firestore.rules firebase/firestore.rules REGRAS-PARA-COLAR-NO-FIREBASE.txt tests/firestore.rules.test.mjs
          git commit -m "feat: live-wide Zy Coin alerts, sounds and mature access"
          git push origin HEAD:zycoin-support-notifications
