name: Platform stability patch

on:
  push:
    branches: [zytrix-platform-expansion-prod]
    paths:
      - scripts/patch-platform-stability.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zytrix-platform-expansion-prod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic stability patch
        run: python scripts/patch-platform-stability.py
      - name: Validate JavaScript syntax
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js live.html perfil.html notificacoes.html admin.html categoria.html assets/css/platform.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: stabilize platform expansion runtime"
          git push origin HEAD:zytrix-platform-expansion-prod
