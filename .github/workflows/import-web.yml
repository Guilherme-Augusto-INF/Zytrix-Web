name: Importar snapshot Zytrix Web

on:
  push:
    paths:
      - '.github/workflows/import-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar snapshot atual
        run: |
          curl -fL "https://raw.githubusercontent.com/Guilherme-Augusto-INF/Zytrix-Figma/main/snapshots/Zytrix-HTML-CSS-Twitch-Kick-v3.zip" -o /tmp/zytrix.zip

      - name: Extrair projeto
        run: |
          rm -rf /tmp/zytrix-import
          mkdir -p /tmp/zytrix-import
          unzip -q /tmp/zytrix.zip -d /tmp/zytrix-import
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/zytrix-import/Zytrix-HTML-CSS-Twitch-Kick-v3/ ./

      - name: Preservar workflow de importação
        run: |
          mkdir -p .github/workflows
          git show HEAD:.github/workflows/import-web.yml > .github/workflows/import-web.yml

      - name: Commitar versão web descompactada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "feat: adiciona versão web Twitch + Kick v3"
            git push
          fi
