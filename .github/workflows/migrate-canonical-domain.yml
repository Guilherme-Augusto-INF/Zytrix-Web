name: Migrate canonical domain

on:
  push:
    paths:
      - ".github/workflows/migrate-canonical-domain.yml"

permissions:
  contents: write

jobs:
  migrate-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Substituir domínio canônico antigo
        shell: python
        run: |
          from pathlib import Path

          OLD = "zytrix-web.vercel.app"
          NEW = "zytrix-lives.vercel.app"

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github/workflows' in path.as_posix():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if OLD not in text:
                  continue
              path.write_text(text.replace(OLD, NEW), encoding='utf-8')
              changed.append(str(path))

          print(f"Arquivos atualizados: {len(changed)}")
          for path in changed:
              print(path)

          if not changed:
              raise SystemExit('Nenhuma referência ao domínio antigo foi encontrada fora dos workflows.')

      - name: Validar migração pública
        shell: bash
        run: |
          if git grep -n 'zytrix-web.vercel.app' -- ':!.github/workflows/**'; then
            echo 'Ainda existem referências públicas ao domínio antigo.'
            exit 1
          fi
          grep -q 'https://zytrix-lives.vercel.app' index.html
          grep -q 'https://zytrix-lives.vercel.app' sobre.html
          grep -q 'https://zytrix-lives.vercel.app/sitemap.xml' robots.txt
          grep -q 'https://zytrix-lives.vercel.app' sitemap.xml
          test "$(cat google87f94d9d56cacf74.html)" = "google-site-verification: google87f94d9d56cacf74.html"

      - name: Commitar migração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/**'
          git commit -m "seo: define zytrix-lives como dominio canonico" || exit 0
          git push
