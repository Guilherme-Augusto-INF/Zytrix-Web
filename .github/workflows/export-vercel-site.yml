name: Export Vercel Site

on:
  push:
    branches: [main, zycoin-support-notifications]
    paths:
      - "*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "vercel.json"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/export-vercel-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar regras de notificações
        if: github.ref == 'refs/heads/zycoin-support-notifications'
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("firestore.rules"),
              Path("firebase/firestore.rules"),
              Path("REGRAS-PARA-COLAR-NO-FIREBASE.txt"),
          ]

          anchor = "\n".join([
              "      // ================================================",
              "      // HISTÓRICO",
              "      // ================================================",
              "",
          ])

          block = "\n".join([
              "      // ================================================",
              "      // ESTADO DAS NOTIFICAÇÕES",
              "      // ================================================",
              "      //",
              "      // Documento privado da própria conta usado apenas",
              "      // para sincronizar lido/não lido entre dispositivos.",
              "      // Não cria notificações e não altera Zy Coins.",
              "      // ================================================",
              "",
              "      match /notificationState/{stateId} {",
              "",
              "        allow read:",
              "          if isOwner(uid)",
              "          || isAdmin();",
              "",
              "        allow create, update:",
              "          if isOwner(uid)",
              "",
              "          && stateId == \"zycoins\"",
              "",
              "          && request.resource.data.uid == uid",
              "",
              "          && request.resource.data.lastSupportSeenAt",
              "              == request.time",
              "",
              "          && request.resource.data.updatedAt",
              "              == request.time",
              "",
              "          && request.resource.data.keys().hasAll([",
              "            \"uid\",",
              "            \"lastSupportSeenAt\",",
              "            \"updatedAt\"",
              "          ])",
              "",
              "          && request.resource.data.keys().hasOnly([",
              "            \"uid\",",
              "            \"lastSupportSeenAt\",",
              "            \"updatedAt\"",
              "          ]);",
              "",
              "        allow delete:",
              "          if isOwner(uid)",
              "          || isAdmin();",
              "      }",
              "",
              "",
          ])

          changed = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "match /notificationState/{stateId}" in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f"Anchor not found in {path}")
              path.write_text(text.replace(anchor, block + anchor, 1), encoding="utf-8")
              changed.append(str(path))

          print("Patched:", ", ".join(changed) if changed else "already patched")
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add firestore.rules firebase/firestore.rules REGRAS-PARA-COLAR-NO-FIREBASE.txt
            git commit -m "feat: secure synced notification read state"
            git push origin HEAD:zycoin-support-notifications
          fi

      - name: Preparar arquivos de deploy
        shell: bash
        run: |
          set -e
          mkdir -p export/assets/css export/assets/js
          cp index.html ao-vivo.html categorias.html categoria.html live.html recursos.html faq.html sobre.html login.html registro.html recuperar-senha.html perfil.html config-live.html loja.html pagamento.html sair.html notificacoes.html admin.html export/
          cp termos.html privacidade.html diretrizes-da-comunidade.html denuncias-e-moderacao.html conteudo-proibido.html politicas.html denunciar.html moderacao.html export/
          cp google87f94d9d56cacf74.html robots.txt sitemap.xml vercel.json export/
          cp assets/css/*.css export/assets/css/
          cp assets/js/*.js export/assets/js/

      - name: Upload do pacote
        uses: actions/upload-artifact@v4
        with:
          name: zytrix-vercel-site
          path: export
          if-no-files-found: error
          retention-days: 1
