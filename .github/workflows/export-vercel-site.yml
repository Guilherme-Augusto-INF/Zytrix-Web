name: Export Vercel Site
# Temporary registered runner for the wallet-privacy patch; restored after validation.

on:
  push:
    branches: [zycoin-support-notifications]
    paths:
      - ".github/workflows/export-vercel-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: zycoin-support-notifications

      - name: Corrigir privacidade da carteira destinatária
        run: python3 scripts/fix-support-wallet-privacy.py

      - name: Validar patch
        shell: bash
        run: |
          set -e
          node --check assets/js/firebase.js
          node --check assets/js/live.js
          node --check assets/js/config-live.js
          grep -q "const commitSupport" assets/js/live.js
          grep -q "increment(amount)" assets/js/live.js
          grep -q "ensureWallet(user.uid)" assets/js/config-live.js
          cmp -s firestore.rules firebase/firestore.rules
          cmp -s firestore.rules REGRAS-PARA-COLAR-NO-FIREBASE.txt

      - name: Commit da correção
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/firebase.js assets/js/live.js assets/js/config-live.js tests/firestore.rules.test.mjs
          git commit -m "fix: keep recipient wallet private during support"
          git push origin HEAD:zycoin-support-notifications
