name: Export Vercel Site

on:
  push:
    branches: [main, feat/platform-governance]
    paths:
      - "*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "vercel.json"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/export-vercel-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar arquivos de deploy
        shell: bash
        run: |
          set -e
          mkdir -p export/assets/css export/assets/js
          cp *.html export/
          cp robots.txt sitemap.xml vercel.json export/
          cp assets/css/*.css export/assets/css/
          cp assets/js/*.js export/assets/js/

      - name: Upload do pacote
        uses: actions/upload-artifact@v4
        with:
          name: zytrix-vercel-site
          path: export
          if-no-files-found: error
          retention-days: 1
