name: Export Vercel Site

on:
  push:
    branches: [zycoin-support-notifications]
    paths:
      - ".github/workflows/export-vercel-site.yml"
      - "scripts/sync-merged-firestore-rules.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: zycoin-support-notifications

      - name: Sincronizar regras atuais com alertas de apoio
        run: python3 scripts/sync-merged-firestore-rules.py

      - name: Validar cópias
        shell: bash
        run: |
          set -e
          cmp -s firestore.rules firebase/firestore.rules
          cmp -s firestore.rules REGRAS-PARA-COLAR-NO-FIREBASE.txt
          grep -q 'validSupportAlertSound' firestore.rules
          grep -q 'match /notificationState/{stateId}' firestore.rules
          grep -q 'match /supportAlerts/{alertId}' firestore.rules
          grep -q 'supportAlertSound' firestore.rules
          grep -q 'matureContent' firestore.rules

      - name: Commit das regras mescladas
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules firebase/firestore.rules REGRAS-PARA-COLAR-NO-FIREBASE.txt
          git commit -m "fix: merge live alerts into current Firestore security rules"
          git push origin HEAD:zycoin-support-notifications
